name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A real Postgres, or the whole real-schema suite is green-by-absence: testutil.New(t)
    # USED TO SKIP when DOCS_TEST_DATABASE_URL was unset, so before this block every SEC-4
    # cross-tenant test silently skipped on every PR while CI stayed green. It now FAILS
    # instead (see requireDatabaseURL, and the note further down), which is what makes a
    # service container that did not come up loud rather than invisible. pgvector/pgvector:pg16 matches docker-compose.yaml — the
    # migrations require the `vector` extension (0001_core.sql, 0004_search.sql).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # ⚠ KEEP EQUAL TO go.mod's `toolchain` (go1.26.6). actions/setup-go exports
          # GOTOOLCHAIN=local, so this pin — not the directive — is what every job actually runs,
          # including the gofmt gate and the real-Postgres suite. Enforced by
          # internal/toolchainguard.
          go-version: "1.26.6"
          cache: true
      # Formatting gate. Nothing checked gofmt before this — not `go vet`, not the frontend
      # job, nowhere in this file — and 5 files had already drifted. talyvor-lens had exactly
      # this hole and reached 37 files, at which point a stricter linter version would have
      # reddened every unrelated PR. Cheap to hold at zero, expensive to pay down later.
      #
      # `gofmt -l` lists files whose formatting differs; test -z fails the build if the list
      # is non-empty, and the second invocation prints WHICH files so the failure is
      # actionable. Uses the toolchain's own gofmt, so "formatted" means one thing here and on
      # a developer's machine.
      # A `finally` DOES NOT RUN ON SIGTERM, and 43 of this repo's control scripts mutate a
      # tracked file and restore it in one. NONE installed a handler before this step.
      #
      # ⚠ ORG-LEVEL CLASS GUARD, NOT A DOCS GUARD — the same reasoning the compose-secrets and
      # govulncheck jobs already state. The hazard was measured in talyvor-suite (W1.7, 78c69c8):
      # a 2-minute command timeout killed a control mid-mutation and left deploy/decision-expiry.sh
      # reading `if true; then` WHERE A GATE HAD BEEN, with a green suite and a `git status`
      # showing only files the session had edited on purpose. Reproduced on demand in 5de27e3, and
      # again HERE while porting this: same kill, and the file left mutated was go.mod.
      #
      # Estate-wide at f8e7236: 163 mutate-and-restore scripts, 3 protected — all three in the one
      # repo that had been bitten. The script carries no Docs-specific knowledge and is meant to be
      # copied into talyvor-track, talyvor-code and talyvor-lens alongside this step.
      #
      # The allowlist inside it may only SHRINK: R2 fails on an entry that has been fixed, R1 on a
      # new unprotected script, R3 is a floor on the DETECTOR. Detection is `ast`, never grep — a
      # regex counts the word "signal" in a COMMENT as a handler, and `grep -l finally:` counts 60
      # scripts here where the real population is 43.
      - name: control scripts must restore on SIGTERM, not only in a finally
        run: python3 scripts/check-restore-signal-handlers.py --ci
      - name: gofmt (formatting must not drift)
        run: test -z "$(gofmt -l .)" || { echo "::error::unformatted files — run gofmt -w"; gofmt -l .; exit 1; }
      - run: go vet ./...
      # DOCS_TEST_DATABASE_URL is the ADMIN dsn: testutil.New(t) connects to it to
      # CREATE/DROP an isolated per-test database, then applies the embedded
      # migrations to that database. It must point at a maintenance db, not the
      # per-test one.
      - name: go test (real Postgres — real-PG tests must RUN, not skip)
        run: go test -timeout 300s -race -count=1 ./...
        env:
          DOCS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      # NOTE — the "assert real-PG tests actually ran" step was REMOVED here, deliberately.
      #
      # It ran `go test -v -run 'RealPG|SEC4|A3'` and failed on any skip, to catch the suite
      # regressing to green-by-absence. Two things made it worse than no guard:
      #
      #   · SCOPE. It selected tests BY NAME. That matched 36 of the 78 tests in this repo
      #     that need a real Postgres — 46%. The other 42, including the roster-provenance
      #     guards added in #43, were never covered, so a passing step implied protection it
      #     did not have. A guard built to prevent green-by-absence was itself covering
      #     almost half of what it named, and nothing about it passing said so.
      #   · REDUNDANCY. internal/testutil now FAILS rather than skips when
      #     DOCS_TEST_DATABASE_URL is unset (see requireDatabaseURL). That covers all 78 by
      #     construction, with no list to keep current — a missing DSN or a service container
      #     that did not come up now fails the main `go test` step above, loudly.
      #
      # WHAT IS NO LONGER GUARDED, stated plainly: an explicitly authored `t.Skip` inside a
      # real-PG test. That is a visible line in a pull-request diff, unlike the invisible
      # env-var failure this step was built for — which is now impossible. If that residual
      # case ever wants covering, the shape is a WHOLE-SUITE assertion over `go test -json`,
      # never another name filter.

  # Supply-chain gate: govulncheck against the Go vulnerability DB.
  #
  # ⚠ THERE WAS NONE, AND THE ABSENCE WAS THE FINDING (W6.33). Measured on clean main:
  # `govulncheck ./...` reported TEN CALLED vulnerabilities — CALLED, not the separate "in
  # modules you require but your code doesn't appear to call" bucket it counts on its own line —
  # and this file contained the word govulncheck exactly zero times. The toolchain pin (#200)
  # took ten to one; this job is what would have said so in the first place.
  #
  # ⚠ ORG-LEVEL CLASS GUARD, NOT A DOCS GUARD — the same reasoning the compose-secrets job below
  # already states. talyvor-lens gated on govulncheck all along and talyvor-docs and talyvor-track
  # did not, so the same accumulation happened twice in parallel, unwatched, in the two repos that
  # hold real Postgres. This job carries no Docs-specific knowledge and lands in track in the same
  # measurement.
  #
  # ⚠ LANDED RED ON PURPOSE, BEFORE the bump that clears it, and the PR's check history is the
  # evidence rather than a claim: the first commit is this job alone and it FAILS naming
  # GO-2026-5970 (golang.org/x/text). A gate nobody has watched fail is the same thing as no gate.
  #
  # govulncheck is reachability-aware, so it stays low-noise: a require-only/unreachable vuln does
  # not fail the build. The tool is pinned; the advisory DB is fetched fresh at scan time, so this
  # job can go red on a tree nobody touched — that is the point of it.
  #
  # Deliberately its own job with no `needs:`, so a supply-chain finding reports independently of
  # the Go suite rather than being buried behind it.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # ⚠ KEEP EQUAL TO go.mod's `toolchain` (go1.26.6). govulncheck grades the STDLIB against
          # the toolchain it runs under: a pin ABOVE go.mod's would assess a runtime this repo does
          # not ship and could report green over a vulnerable binary, and a pin BELOW it reports
          # vulns nothing ships. internal/toolchainguard enforces the floor half of that lockstep
          # across every go-version pin in this file.
          go-version: "1.26.6"
          cache: false
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  # The SEC-4 tenancy class-guard. Written in .semgrep/ since the SEC-4 work but
  # never wired into CI — a rule that does not run is not a guardrail.
  # ORG-LEVEL CLASS GUARD, not a Docs guard. talyvor-docs and talyvor-track independently
  # shipped the identical defect — a compose file supplying a real default for
  # GATEWAY_AUTH_SECRET — and two separate audits found them. A per-repo test cannot catch
  # the next repo, so scripts/check-compose-secrets.sh contains no Docs-specific knowledge
  # and is meant to be copied verbatim into talyvor-track, talyvor-lens and talyvor-suite
  # alongside this job. Porting instructions are in the script header and the fix report.
  #
  # Deliberately its own job, with no `needs:`, so it runs in parallel and reports
  # independently of the Go suite — the finding it makes is a deploy blocker, not a test
  # failure, and should not be buried behind a 2-minute test job.
  compose-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: no compose file may supply a secret value
        run: ./scripts/check-compose-secrets.sh

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.165.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # THE RULES' OWN TEST, AND IT RUNS FIRST — a class guard that has silently narrowed makes
      # the scan below exit 0 for the wrong reason, so "the rules still catch what they claim"
      # has to be established before "the tree is clean" means anything.
      #
      # docs-no-url-param-workspace-scope narrowed twice. Once visibly (a paths.include
      # allow-list that omitted four packages, one of them shipping the exact defect the rule
      # exists to catch) and once invisibly: its pattern matches a LITERAL param name, so the
      # single indirect workspace read in the tree — ratelimit.WorkspaceLimit, whose param name
      # is a function argument — was never flagged, while carrying an inline exemption written
      # as though it had been.
      #
      # `semgrep --test` pairs a rule file with a fixture of the same basename IN THE SAME
      # DIRECTORY, hence the copy: the fixtures live in .semgrep/tests/ (a `tests/` path
      # component is in semgrep's default ignore, which is what keeps their deliberate
      # violations out of the scan below — measured; a hidden directory does NOT have that
      # property) and running --test in place would load .semgrep/*.yml twice.
      - name: rule fixtures (the class guards must still catch what they claim)
        run: |
          set -eu
          mkdir -p /tmp/semgrep-rule-tests
          cp .semgrep/*.yml .semgrep/tests/*.go /tmp/semgrep-rule-tests/
          semgrep --test /tmp/semgrep-rule-tests
      # AND THE TWO THINGS THE FIXTURES ARE BLIND TO. `semgrep --test` applies a rule straight to
      # its fixture and IGNORES `paths:` — so the fixtures stay 4/4 green while an allow-list
      # narrows the rule to nothing in production. That is not hypothetical: it is the narrowing
      # this repo already shipped. This check also names the rules that have no fixture, so a new
      # one cannot join them silently.
      - name: rule scope (no allow-lists; the unfixtured rules are named)
        run: python3 scripts/check-semgrep-rule-scope.py
      # --error → non-zero exit on any finding, so this BLOCKS rather than reports.
      - run: semgrep --config .semgrep/ --error --quiet

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run typecheck
      # Frontend unit/route tests (vitest). Added with the URL router — before it there was
      # no frontend test framework at all. Runs the router's path builders, the no-oracle
      # resource guard, and the route table so a broken link or a leaked-existence guard fails
      # the build rather than shipping. A tool that runs but isn't gated is the same
      # green-by-absence trap the backend anti-skip step closes.
      - run: cd frontend && npm test
      - run: cd frontend && npm run build

  build-image:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/talyvor-docs:latest
            ghcr.io/${{ github.repository_owner }}/talyvor-docs:${{ github.sha }}
