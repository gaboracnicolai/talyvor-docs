# Talyvor Docs — local + self-hosted compose stack.
#
# Three services:
#   docs       Go API server (port 4000)
#   frontend   nginx serving the built SPA (port 4001)
#   postgres   pgvector-flavoured Postgres for full-text + semantic search
#
# The docs service applies the schema itself on boot (internal/migrate, embedded
# migrations, recorded in schema_migrations). It waits on postgres via the healthcheck
# below, so a fresh volume and an existing one both converge to the current schema.

services:
  docs:
    build: .
    ports:
      # LOOPBACK ONLY, matching talyvor-lens. "4000:4000" binds 0.0.0.0, publishing the API
      # to every interface — and three surfaces sit OUTSIDE the gateway boundary there:
      # /metrics, /healthz, /readyz, plus the custom-domain public renderer, which is
      # selected by a client-supplied Host header. Reaching Docs directly also bypasses the
      # edge gateway that injects x-gateway-auth, which is the only reason /v1 identity
      # headers can be trusted. The reverse proxy is the front door; it connects over
      # loopback (or the compose network) and nothing else needs to.
      - "127.0.0.1:4000:4000"
    environment:
      - DOCS_DATABASE_URL=postgres://docs:${POSTGRES_PASSWORD:-changeme}@postgres:5432/talyvor_docs?sslmode=disable
      # SEC-4 Layer 1 root of trust. config.Load() REQUIRES this at >= 16 chars and
      # exits(1) otherwise — correctly, since without it every /v1 identity is forgeable.
      #
      # NO DEFAULT, deliberately. This carried `${GATEWAY_AUTH_SECRET:-dev-only-…}`, and a
      # `:-` fallback silently SUPPLIES the value the boot check then approves — so
      # `docker compose up` with no operator input produced a running server whose secret
      # was published in this repo, i.e. one where anyone could forge any identity. The
      # fail-closed check could never fire on the only configuration that needed it.
      #
      # `:?` makes compose itself refuse to start with a named error, before the container
      # exists. That old placeholder is now permanently rejected by config.Load() too
      # (publishedGatewaySecrets) — it is in git history and cannot be made secret again.
      #
      #   export GATEWAY_AUTH_SECRET="$(openssl rand -hex 32)"
      #
      # It must match the value the edge gateway signs (the same one Track uses).
      - GATEWAY_AUTH_SECRET=${GATEWAY_AUTH_SECRET:?set GATEWAY_AUTH_SECRET to the gateway's shared secret — openssl rand -hex 32}
      - DOCS_LENS_URL=${DOCS_LENS_URL:-}
      - DOCS_LENS_API_KEY=${DOCS_LENS_API_KEY:-}
      - DOCS_TRACK_URL=${DOCS_TRACK_URL:-}
      - DOCS_TRACK_API_KEY=${DOCS_TRACK_API_KEY:-}
      - DOCS_LOG_LEVEL=${DOCS_LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/healthz"]
      interval: 10s
      retries: 3

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      # Loopback for the same reason as `docs` above — the reverse proxy fronts the SPA.
      - "127.0.0.1:4001:80"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: talyvor_docs
      POSTGRES_USER: docs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The ./migrations:/docker-entrypoint-initdb.d mount is GONE. That hook runs only
      # on first boot of an empty data directory, so it could bootstrap a new install
      # but could never upgrade an existing one — adding a 00NN_*.sql to a running
      # deployment did nothing, silently. The docs service now applies migrations on
      # boot via its embedded runner (internal/migrate), which records every version in
      # schema_migrations and works on both a fresh and an existing database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docs -d talyvor_docs"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
