# SEC-4 Layer-2 class-guard for the secondary handler groups. Two shapes, both = a verified member
# of workspace A reaching workspace B's objects:
#
#   (a) BARE by-id: a DELETE/UPDATE/SELECT store op `WHERE id = $N` (ANY positional index — $1,
#       $2, $3, …) with NO workspace predicate. (The regex was `\$1`-anchored until the #32 sweep's
#       hardening pass; a `$2`/`$3` by-id write slipped it — block.Update WHERE id=$3 etc.)
#   (b) DECEPTIVE:  a workspace value taken from chi.URLParam (attacker-controlled path param) and
#       used to scope a store op — "looks scoped, isn't."
#
# The fix for both: scope to the caller's VERIFIED membership set —
#   WHERE id = $1 AND workspace_id = ANY($n)   with $n = authz.WorkspaceIDs(ctx)
# (or a parent-join subquery containing `workspace_id = ANY($n)` for child tables).
#
# NOTE (metavariable-regex is re.match-ANCHORED and the raw-string value includes the leading
# backtick, so patterns need a `(?s).*` prefix to match anywhere in the SQL literal).
#
# BLIND SPOT: rule (a) matches only SQL WRITTEN AT THE CALL — its $SQL metavariable binds the NAME for
# `sql := …; Exec(ctx, sql, ...)`, so whatever that name holds was never checked.
# That is the class that hid track's issue BulkUpdate. Rule
# docs-by-id-write-requires-workspace-scope-sprintf (below) covers Sprintf-constructed by-id writes,
# with documented inline nosemgrep at page/store.go + space/store.go Update (safe: callers gate the id
# upstream via assertInWorkspaces / the collab WithPageScope session binding).
#
# ⚠ THAT PARAGRAPH SAID "BLIND SPOT (closed)" AND NAMED Sprintf AS THE SHAPE, AND Sprintf WAS ONE OF
# FOUR. MEASURED at 09d8c2e on the CI-pinned semgrep 1.165.0, against a file holding the same
# unscoped by-id write in seven forms: THE WHOLE SHIPPED RULE SET RETURNED ZERO FINDINGS for the SQL
# held in a package `const`, a package `var`, a local variable, and a local variable built by
# concatenation. Caught: the literal written at the call, and — measured, because it is not where it
# looks — that same concatenation when it is the call's ARGUMENT rather than a name
# (`Exec(ctx, `UPDATE … WHERE id = $1 RETURNING ` + cols, …)` IS flagged; assign it to `q` first and
# it is not). Nothing chose that boundary. docs-by-id-write-requires-workspace-scope-indirect-literal
# below moves the anchor onto the SQL itself, which is where the evidence is.
#
# ⚠ LATENT, NOT LIVE, AND SAY SO: a census of all 164 production `pool.Exec/Query/QueryRow` sites at
# 09d8c2e found 149 inline literals, 2 Sprintf and 13 indirect — and NOT ONE of the 13 is a by-id
# DELETE/UPDATE. No shipped statement was hiding here. What the shape costs is the NEXT one, and
# `SELECT ` + cols + ` FROM …` assigned to a name is already house style in comment, page and space.
rules:
  - id: docs-by-id-write-requires-workspace-scope
    languages: [go]
    severity: ERROR
    message: >
      SEC-4 L2: this by-id DELETE/UPDATE (WHERE id = $N, any positional index) has no workspace_id
      scope, so a verified member of any workspace can act on another workspace's object by id. Scope
      it to the caller's verified set: `AND workspace_id = ANY($n)` where $n = authz.WorkspaceIDs(ctx)
      (or a parent-join subquery containing workspace_id = ANY). If an upstream assertInWorkspaces /
      route-enforcer gate 404s a foreign id BEFORE this write, suppress with an inline nosemgrep +
      written reason. Reference: internal/page/store.go GetByIDInWorkspaces.
    patterns:
      - pattern-either:
          - pattern: $POOL.Exec($CTX, $SQL, ...)
          - pattern: $POOL.QueryRow($CTX, $SQL, ...)
          - pattern: $POOL.Query($CTX, $SQL, ...)
      - metavariable-regex:
          metavariable: $SQL
          regex: (?s).*(DELETE FROM|UPDATE)\s+\w+.*WHERE id = \$\d+
      # Excluded when the SAME statement is already membership-scoped (…workspace_id = ANY / = ANY subquery):
      - pattern-not:
          patterns:
            - pattern: $POOL.$M($CTX, $SQL, ...)
            - metavariable-regex:
                metavariable: $SQL
                regex: (?s).*workspace_id = ANY

  - id: docs-no-url-param-workspace-scope
    languages: [go]
    severity: ERROR
    message: >
      SEC-4 L2 (deceptive shape): a workspace value read from chi.URLParam is attacker-controlled —
      scoping a store op to it "looks scoped but isn't." Scope by authz.WorkspaceIDs(ctx) (the verified
      membership set). A path {wsID} may only be used as a WRITE TARGET after authz.AuthorizeWorkspace
      confirms membership — mark those lines `// nosemgrep: docs-no-url-param-workspace-scope` with the
      reason. Approximation: this flags every chi.URLParam("wsID"); the few authorized write-targets are
      suppressed inline (documented limitation).
    patterns:
      - pattern: chi.URLParam($R, "wsID")
    # NO paths FILTER — this rule scans the whole tree, and that is load-bearing.
    #
    # It carried a `paths.include` allow-list of ten packages, alongside a comment declaring
    # the blind spot "closed" because page/space/search had been added to it. The blind spot
    # was NOT closed. Four packages that read {wsID} were never in the list — ai, analytics,
    # freshness, trackintegration — and internal/trackintegration was, at that moment,
    # shipping the exact defect this rule exists to catch: GetIssue and Search passed an
    # unauthorized path {wsID} to the Track client, which forwards it under Docs's own
    # service API key. The rule ran on every PR, exited 0, and could not see it.
    #
    # The comment even stated the correct principle — "a guardrail whose scope is 'the code
    # we already fixed' cannot catch the next miss" — and was then satisfied by extending the
    # list with the packages that had just been fixed. An allow-list can only ever ratify
    # yesterday's sweep, and a false assurance printed beside a live gap is worse than no
    # comment: the next reader trusts it.
    #
    # Exceptions are now a DENY-LIST of named sites, not remembered packages: every
    # legitimate use carries an inline `// nosemgrep: docs-no-url-param-workspace-scope --
    # <reason>` at the line itself. That is strictly better than a directory filter, because
    # each exemption is one line long, states why it is safe, and is reviewed in the diff
    # that introduces it — while any NEW unauthorized read is flagged by default, which is
    # the property that failed here.
    #
    # ⚠ THAT LAST SENTENCE WAS TRUE ONLY OF *ONE* LITERAL, AND THE SENTENCE BELOW USED TO SAY
    # "a read whose param NAME is not a literal is not flagged", WHICH UNDERSTATED IT BY A
    # WHOLE CLASS. This pattern matches ONE STRING — `"wsID"`. A read whose param name is not
    # a literal is not flagged; NEITHER IS A READ WHOSE NAME IS A DIFFERENT LITERAL, and for
    # years the rule below excluded every string literal on the written grounds that this rule
    # owned them all. It owns one. `chi.URLParam(r, "workspaceID")` was invisible to BOTH.
    # See the corrected note on docs-no-indirect-url-param-scope; the fixture's
    # aliasWorkspaceRead/tenantWorkspaceRead are the red that measured it at d34e01c.
    # MEASURED, both directions, because the boundary is not where it looks:
    #   · `const wsParam = "wsID"; chi.URLParam(r, wsParam)`  IS flagged — semgrep constant-
    #     propagates within a file, so a named constant is not an escape.
    #   · `func f(param string) { chi.URLParam(r, param) }`   is NOT flagged — propagation
    #     does not cross a function boundary, and this is the shape three of this repo's own
    #     middlewares already use (ratelimit.WorkspaceLimit, permission's two enforcers).
    # The evidence that the gap was invisible rather than accepted: ratelimit/middleware.go
    # carried a `// nosemgrep: docs-no-url-param-workspace-scope` for a finding this rule has
    # never produced — an exemption written by someone who believed the line was covered.
    # docs-no-indirect-url-param-scope below closes it; see .semgrep/operate-by-id-tenancy.go
    # for the fixture that fails if either half regresses.

  # ── The blind spot of the rule above, closed — properly this time. A path param read whose name
  #    this rule set cannot place is not automatically a defect: it is a read NOBODY HAS
  #    CLASSIFIED. Each of the four in the tree says why at the line, which is the same deny-list
  #    discipline the sibling rule uses.
  #
  # ⚠ WHAT THIS RULE USED TO SAY, AND WHY IT WAS THE SAME MISTAKE ONE LEVEL DOWN. It read
  #   `pattern-not: chi.URLParam($R, "...")` — EXCLUDE EVERY STRING LITERAL — justified at the
  #   line by "Every literal read is the sibling rule's business, INCLUDING \"wsID\"". The
  #   sibling's business is EXACTLY ONE LITERAL. So a workspace path param spelled any other
  #   literal way — {workspaceID}, {workspace_id}, {tenantID} — was invisible to BOTH rules BY
  #   CONSTRUCTION, and the deny-list of inline suppressions had nothing to deny. That is the
  #   `paths:` allow-list this file was rewritten to kill, wearing a different hat: a false
  #   assurance printed beside a gap, and the assurance is the part a reviewer trusts.
  #   MEASURED red at d34e01c on the CI-pinned semgrep 1.165.0 before this was changed: the
  #   fixture's aliasWorkspaceRead ("workspaceID") and tenantWorkspaceRead ("tenantID") produced
  #   NO FINDING FROM ANY OF THE FIVE RULES.
  #
  # ⚠ IT WAS LATENT, NOT LIVE, AND SAY SO RATHER THAN IMPLY A SAVE. Re-censused at d34e01c over
  #   non-test internal/ + cmd/: the tree reads 16 distinct URL-param literals — pageID (52),
  #   wsID (19), id (11), dbID (9), spaceID (8), version (3), templateID (2), rowID (2),
  #   issueID (2), blockID (2), viewID, token, slug, requestID, permID, other — and every one of
  #   the 15 non-wsID names was read and confirmed to be a resource id, a version number, a share
  #   token or a slug. NOT ONE is a workspace under another name. No shipped read was hiding here.
  #   What the shape cost was the NEXT one.
  #
  # ⚠ WHY THE EXEMPTION IS A CENSUS IN THE RULE AND NOT ~100 INLINE SUPPRESSIONS. Dropping the
  #   blanket exclusion to `"wsID"` alone was the other candidate fix and it is worse: it makes
  #   every one of the 92 non-workspace literal reads an unclassified finding needing a line-level
  #   suppression that says nothing — which is how a class guard becomes noise and then becomes
  #   ignored. The list below is the classification, made once, from a measurement. Its guarantee
  #   is narrow and stated: A NAME OUTSIDE THIS SET IS FLAGGED. It does not know what a name
  #   MEANS — someone could add "workspaceID" to it — but that is a rule diff with a written
  #   reason, reviewed, and not the silence it replaces.
  #
  # ⚠ AND THE LIST IS MEASURED RATHER THAN REMEMBERED: internal/paramcensus asserts, in BOTH
  #   directions, that this regex's alternatives are exactly the non-wsID literals the tree
  #   actually reads. A dead exemption (a name that leaves the tree but stays exempt here, ready
  #   to be re-used for something else) fails there. That is the failure mode a remembered list
  #   has and a `paths:` allow-list had.
  - id: docs-no-indirect-url-param-scope
    languages: [go]
    severity: ERROR
    message: >
      SEC-4 L2 (unclassified param name): this reads a chi path param that NO RULE HERE CAN PLACE —
      either its NAME is not a literal at this site, or it is a literal nobody has classified.
      docs-no-url-param-workspace-scope matches exactly one string, chi.URLParam($R, "wsID"), and
      the census of names measured NOT to be a workspace is in this rule's pattern-not; anything
      else could be the workspace. Constant propagation covers `const p = "wsID"`; it does NOT
      cross a function boundary, so a name arriving as an ARGUMENT reads a param the class guard
      never sees, and a NEW literal spelling ({workspaceID}, {tenantID}) is a workspace the sibling
      was never told about. If the value can be the workspace, authorize it
      (authz.AuthorizeWorkspace) or scope by authz.WorkspaceIDs(ctx) before it reaches a store. If
      it is a resource id resolved elsewhere, either add it to this rule's census (and to
      internal/paramcensus, which asserts the two agree) or say so in an inline
      `// nosemgrep: docs-no-indirect-url-param-scope -- <what this name is, and who scopes it>`.
    patterns:
      - pattern: chi.URLParam($R, $P)
      # "wsID" is the sibling rule's ONE literal — excluded here so no line needs two
      # suppressions, and so the two rules partition the reads instead of overlapping.
      - pattern-not: chi.URLParam($R, "wsID")
      # ── THE CENSUS OF NAMES MEASURED NOT TO BE A WORKSPACE (d34e01c). Everything else — a name
      #    arriving as an argument, or a literal nobody has classified — is a finding.
      #
      # NOTE, MEASURED rather than assumed, because it is the way this clause silently does
      # nothing: a metavariable bound to a string literal carries its QUOTES in the text
      # metavariable-regex sees. `^pageID$` matches NOTHING here; `^"pageID"$` matches. Probed on
      # the CI-pinned semgrep 1.165.0 with both anchorings against one real read — same family as
      # the leading-backtick note at the head of this file.
      - pattern-not:
          patterns:
            - pattern: chi.URLParam($R, $P)
            - metavariable-regex:
                metavariable: $P
                regex: ^"(pageID|id|dbID|spaceID|version|templateID|rowID|issueID|blockID|viewID|token|slug|requestID|permID|other)"$

  - id: docs-by-id-write-requires-workspace-scope-sprintf
    languages: [go]
    severity: ERROR
    message: >
      SEC-4 L2 (Sprintf variant): a by-id DELETE/UPDATE built with fmt.Sprintf has NO workspace scope in
      its FORMAT literal — the same cross-tenant class as the inline-literal rule, but constructed
      dynamically so that rule is BLIND to it (its $SQL metavariable binds the variable name, not the
      format string). This is the blind spot that hid track's issue BulkUpdate. Scope it in-SQL
      (AND workspace_id = ANY($n), $n = authz.WorkspaceIDs(ctx)); or, if an upstream assertInWorkspaces
      gate 404s a foreign id BEFORE the by-id write, suppress with an inline nosemgrep + written reason.
    patterns:
      - pattern: fmt.Sprintf($FMT, ...)
      - metavariable-regex:
          metavariable: $FMT
          regex: (?s).*(DELETE FROM|UPDATE)\s+\w+.*WHERE id = \$
      - pattern-not:
          patterns:
            - pattern: fmt.Sprintf($FMT, ...)
            - metavariable-regex:
                metavariable: $FMT
                regex: (?s).*workspace_id

  # ── THE SQL LITERAL THAT IS NOT THE CALL'S ARGUMENT. Anchored on the ASSIGNMENT, exactly as the
  #    Sprintf rule is anchored on the Sprintf, and for the same reason: the SQL is the evidence.
  #    Following a name to its call site is a dataflow problem that grows one blind spot per
  #    plumbing shape, and this rule exists because that is what happened.
  - id: docs-by-id-write-requires-workspace-scope-indirect-literal
    languages: [go]
    severity: ERROR
    message: >
      SEC-4 L2 (indirect literal): this names a by-id DELETE/UPDATE (WHERE id = $N) with no
      workspace scope. The sibling rule reads the CALL's argument, so SQL held in a const, a var or
      a local — including `... ` + cols` assigned to a name — reaches a pool unread by any class
      guard. Same cross-tenant class: a verified member of any workspace acts on another's object
      by id. Scope it in-SQL (AND workspace_id = ANY($n), $n = authz.WorkspaceIDs(ctx)) or, if an
      upstream assertInWorkspaces / route-enforcer gate 404s a foreign id BEFORE the write,
      suppress with an inline nosemgrep + written reason.
    patterns:
      - pattern-either:
          - pattern: $X := $SQL
          - pattern: $X = $SQL
          - pattern: var $X = $SQL
          - pattern: const $X = $SQL
          - pattern: $X += $SQL
      # $SQL MUST BE THE SQL, NOT AN EXPRESSION THAT CONTAINS IT.
      #
      # ⚠ THE FIRST VERSION OF THIS CLAUSE WAS `metavariable-pattern` REQUIRING A STRING, AND IT DID
      # NOTHING — measured, 16 findings across eight stores, every one an ordinary
      # `if _, err := pool.Exec(ctx, `DELETE … WHERE id = $1`, id)`. `metavariable-pattern` matches
      # ANYWHERE INSIDE the binding, so a CALL that merely contains a string literal satisfies
      # `pattern: "..."`. The rule was a duplicate-report generator for findings the sibling rule
      # already owns, dressed as a new guard. Excluding the call-shaped right-hand side is what
      # actually separates "SQL held in a name" from "SQL written at the call".
      - pattern-not: $X := $F(...)
      - pattern-not: $X = $F(...)
      - pattern-not: $X, $Y := $F(...)
      - pattern-not: $X, $Y = $F(...)
      - metavariable-regex:
          metavariable: $SQL
          regex: (?s).*(DELETE FROM|UPDATE)\s+\w+.*WHERE id = \$\d+
      # Already membership-scoped in the SAME literal — the sibling rule's exclusion, verbatim, so
      # the two rules cannot disagree about what "scoped" means.
      - pattern-not:
          patterns:
            - pattern-either:
                - pattern: $X := $SQL
                - pattern: $X = $SQL
                - pattern: var $X = $SQL
                - pattern: const $X = $SQL
                - pattern: $X += $SQL
            - metavariable-regex:
                metavariable: $SQL
                regex: (?s).*workspace_id = ANY
      # fmt.Sprintf is the OTHER rule's subject and its format literal contains the same text, so
      # without this the two would both fire on one line and the fixture would fail on a duplicate
      # rather than on a defect. Measured: it does fire there without this clause.
      - pattern-not: $X := fmt.Sprintf(...)
      - pattern-not: $X = fmt.Sprintf(...)
